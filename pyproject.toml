# pyproject.toml is the single source of truth for how this project is built,
# what it depends on, and how its tools (pytest, ruff) are configured.
#
# Naming note: "plumbline" is already taken on PyPI by an unrelated lidar tool,
# so the *distribution* name is plumbline-sql. The *import* name and the CLI
# command are still just `plumbline`.

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline-sql"
version = "0.0.1"
description = "Pre-execution checks that catch AI-written SQL which runs fine but returns the wrong answer."
readme = "README.md"
license = "MIT"
authors = [{ name = "Derek Huang" }]
requires-python = ">=3.11"
# Runtime deps stay tiny on purpose. M0 only needs an HTTP client to talk to
# Ollama. sqlglot + duckdb arrive in M1/M2 when the profiler and rules land.
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
# `plumbline ...` on the command line calls plumbline.cli:main
plumbline = "plumbline.cli:main"

# "src layout": the package lives in src/plumbline so tests always import the
# *installed* package, never a stray local folder. Catches packaging bugs early.
# bench/ is deliberately NOT packaged: it's research tooling you run from the
# repo root with `python -m bench.<module>`, not something users pip install.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests `import bench` (the unpackaged benchmark folder at the repo root).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes basics, I = import sorting, B = common bug patterns,
# UP = modern-Python upgrades.
select = ["E", "F", "I", "B", "UP"]
