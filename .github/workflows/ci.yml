# Continuous integration: on every push and pull request, lint and test.
#
# The rule tests run against small databases built inside the tests (tests/conftest.py),
# so CI needs neither the 1.5 GB BIRD data nor a model. The full benchmark reproduction,
# which does need the data, is its own workflow: reproduce.yml (manual + monthly).

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (pyproject says >=3.11) and a current one.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
