<line class="grid" x1="64" x2="616" y1="284.8" y2="284.8"/>
<text class="tick" x="56" y="288.8" text-anchor="end">10%</text>
<line class="grid" x1="64" x2="616" y1="225.6" y2="225.6"/>
<text class="tick" x="56" y="229.6" text-anchor="end">20%</text>
<line class="grid" x1="64" x2="616" y1="166.4" y2="166.4"/>
<text class="tick" x="56" y="170.4" text-anchor="end">30%</text>
<line class="grid" x1="64" x2="616" y1="107.19999999999999" y2="107.19999999999999"/>
<text class="tick" x="56" y="111.19999999999999" text-anchor="end">40%</text>
<line class="grid" x1="64" x2="616" y1="48.0" y2="48.0"/>
<text class="tick" x="56" y="52.0" text-anchor="end">50%</text>
<text class="tick" x="64.0" y="362" text-anchor="middle">0%</text>
<text class="tick" x="174.4" y="362" text-anchor="middle">2%</text>
<text class="tick" x="284.8" y="362" text-anchor="middle">4%</text>
<text class="tick" x="395.2" y="362" text-anchor="middle">6%</text>
<text class="tick" x="505.6" y="362" text-anchor="middle">8%</text>
<text class="tick" x="616.0" y="362" text-anchor="middle">10%</text>
<line class="axis" x1="64" x2="616" y1="344.0" y2="344.0"/>
<line class="tgt" x1="64" x2="616" y1="107.19999999999999" y2="107.19999999999999"/>
<line class="tgt" x1="340.0" x2="340.0" y1="56" y2="344.0"/>
<text class="tick" x="616" y="101.19999999999999" text-anchor="end">target: 40%+ detection</text>
<text class="tick" x="346.0" y="66">target: 5% or fewer false alarms</text>
<text class="sub" x="340.0" y="386" text-anchor="middle">False alarms on 500 correct (gold) queries</text>
<text class="sub" transform="translate(16 196.0) rotate(-90)" text-anchor="middle">Silent wrong answers caught (of 308)</text>
<circle class="plumbline ring" cx="163.36" cy="213.168" r="6"/>
<text class="lab" x="173.36" y="203.168" text-anchor="start">Plumbline (all rules): 22.1% / 1.8%</text>
<circle class="plumbline ring" cx="64.0" cy="286.576" r="6"/>
<text class="lab" x="74.0" y="308.576" text-anchor="start">Plumbline (own rules): 9.7% / 0.0%</text>
<circle class="other ring" cx="516.64" cy="242.176" r="6"/>
<text class="lab" x="506.64" y="230.176" text-anchor="end">sqlsure: 17.2% / 8.2%</text>
<circle class="other ring" cx="174.4" cy="259.344" r="6"/>
