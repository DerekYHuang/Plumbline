<circle class="other ring" cx="251.68" cy="251.64800000000002" r="6"/>
<text class="lab" x="261.68" y="241.64800000000002" text-anchor="start">graincheck: 15.6% / 3.4%</text>
<circle class="plumbline" cx="406" cy="298" r="5"/>
<text class="sub" x="416" y="302">Plumbline</text>
<circle class="other" cx="406" cy="316" r="5"/>
<text class="sub" x="416" y="320">Existing open-source checkers</text>
