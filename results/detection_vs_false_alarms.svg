<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Detection vs false alarms, by checker</title>
<desc id="d">Scatter. Plumbline all rules: Plumbline (all rules) 22.1% detection at 1.8% false alarms; Plumbline (own rules) 9.7% detection at 0.0% false alarms; sqlsure 17.2% detection at 8.2% false alarms; grainguard 14.3% detection at 2.0% false alarms; graincheck 15.6% detection at 3.4% false alarms.</desc>
<style>
  .bg{fill:#fcfcfb} .grid{stroke:#e1e0d9;stroke-width:1} .axis{stroke:#c3c2b7;stroke-width:1}
  .tick{fill:#898781;font-size:11px} .lab{fill:#0b0b0b;font-size:12px}
  .sub{fill:#52514e;font-size:12px} .ttl{fill:#0b0b0b;font-size:14px;font-weight:600}
  .tgt{stroke:#898781;stroke-width:1;stroke-dasharray:4 4;fill:none}
  .plumbline{fill:#2a78d6} .other{fill:#eb6834} .ring{stroke:#fcfcfb;stroke-width:2}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .grid{stroke:#2c2c2a} .axis{stroke:#383835}
    .lab,.ttl{fill:#f0efec} .sub{fill:#c3c2b7}
    .plumbline{fill:#3987e5} .other{fill:#d95926} .ring{stroke:#1a1a19}
  }
</style>
<rect class="bg" x="0" y="0" width="640" height="400" rx="8"/>
<text class="ttl" x="64" y="24">Silent errors caught vs correct queries wrongly flagged</text>
<text class="sub" x="64" y="40">BIRD Mini-Dev, qwen2.5-coder:7b answers. Up and to the left is better.</text>
<line class="grid" x1="64" x2="616" y1="344.0" y2="344.0"/>
